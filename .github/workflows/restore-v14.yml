name: Restore approved v14 history
on:
  push:
    branches: [codex/restore-github-20260925]
    paths: [.migration/ready.json]
permissions:
  contents: write
concurrency:
  group: restore-github-20260925
  cancel-in-progress: false
jobs:
  restore:
    if: github.repository == 'Cheb1996/Black-Swordsman-3D'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify transfer and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          manifest = json.loads(Path('.migration/ready.json').read_text())
          output = Path(os.environ['RUNNER_TEMP']) / 'history.bundle'
          with output.open('wb') as target:
              for item in manifest['parts']:
                  data = Path('.migration', item['name']).read_bytes()
                  assert hashlib.sha256(data).hexdigest() == item['sha256']
                  target.write(data)
          assert hashlib.sha256(output.read_bytes()).hexdigest() == 'd4d48933e05da4dea1891c3a5b364f3554928e2f699608e5fcdf95e77423d390'
          PY
          git bundle verify "$RUNNER_TEMP/history.bundle"
          git fetch origin main
          test "$(git rev-parse origin/main)" = 268a94fb7666bed52166780acd0eaddf1445d421
          git fetch "$RUNNER_TEMP/history.bundle" main:refs/heads/restored-main
          test "$(git rev-parse restored-main)" = 9b1026131d0e675d16ff8c426f5acbb8d509029d
          git merge-base --is-ancestor origin/main restored-main
          git push origin restored-main:refs/heads/main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 9b1026131d0e675d16ff8c426f5acbb8d509029d
          git push origin --delete codex/restore-github-20260925
